name: Provenance validation

on:
  push:
    paths:
      - "schemas/**"
      - "tools/validate_mct_provenance.py"
      - "tools/mct_provenance_store.py"
      - "tools/run_round49_reference.py"
      - "tools/mct_deployment_control.py"
      - "tools/mct_protected_vault.py"
      - "tools/round50_fixture.py"
      - "tools/run_round50_security.py"
      - "provenance/**"
      - ".github/workflows/provenance-validation.yml"
  pull_request:
    paths:
      - "schemas/**"
      - "tools/validate_mct_provenance.py"
      - "tools/mct_provenance_store.py"
      - "tools/run_round49_reference.py"
      - "tools/mct_deployment_control.py"
      - "tools/mct_protected_vault.py"
      - "tools/round50_fixture.py"
      - "tools/run_round50_security.py"
      - "provenance/**"
      - ".github/workflows/provenance-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check schema JSON syntax
        run: python -m json.tool schemas/mct_provenance_bundle.schema.json > /dev/null

      - name: Run Round-48 provenance semantic self-test
        run: python tools/validate_mct_provenance.py --self-test

      - name: Compile operational modules
        run: python -m py_compile tools/mct_provenance_store.py tools/run_round49_reference.py tools/mct_deployment_control.py tools/mct_protected_vault.py tools/round50_fixture.py tools/run_round50_security.py

      - name: Run Round-49 operational reference self-test
        run: python tools/run_round49_reference.py

      - name: Run Round-50 deployment/security self-test
        run: python tools/run_round50_security.py
