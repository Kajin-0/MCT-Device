name: Provenance validation

on:
  push:
    paths:
      - "schemas/**"
      - "tools/validate_mct_provenance.py"
      - "provenance/**"
      - ".github/workflows/provenance-validation.yml"
  pull_request:
    paths:
      - "schemas/**"
      - "tools/validate_mct_provenance.py"
      - "provenance/**"
      - ".github/workflows/provenance-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check schema JSON syntax
        run: python -m json.tool schemas/mct_provenance_bundle.schema.json > /dev/null

      - name: Run provenance semantic self-test
        run: python tools/validate_mct_provenance.py --self-test
